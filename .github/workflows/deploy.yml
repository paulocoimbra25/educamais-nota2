name: Publicar no GitHub Pages

# Roda automaticamente sempre que você enviar (push) algo para a branch "main"
on:
  push:
    branches: ["main"]
  workflow_dispatch: # também permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências do projeto
        run: npm install

      - name: Gerar a versão de produção (build)
        run: npm run build

      - name: Empacotar a pasta dist/ para publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
